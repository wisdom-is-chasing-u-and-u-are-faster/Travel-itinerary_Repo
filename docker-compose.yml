version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_itinerary_platform
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_PATH=travel_platform.db
      - ENVIRONMENT=production
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  data:
    driver: local
